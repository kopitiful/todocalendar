<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tages-Copilot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #111;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ════════════════════════════════
       LINKE SPALTE – Tages-Übersicht
    ════════════════════════════════ */
    #sidebar {
      width: 240px;
      flex-shrink: 0;
      border-right: 1px solid #f0f0f0;
      display: flex;
      flex-direction: column;
      padding: 32px 20px 24px;
      overflow-y: auto;
    }

    #sidebar .date {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #aaa;
      margin-bottom: 20px;
    }

    #sidebar .section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #ccc;
      margin-bottom: 8px;
      margin-top: 20px;
    }
    #sidebar .section-label:first-of-type { margin-top: 0; }

    .cal-row {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 4px 0;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
    }
    .cal-row:hover { background: #fafafa; }

    .cal-time {
      font-size: 0.75rem;
      color: #bbb;
      min-width: 32px;
      flex-shrink: 0;
    }

    .cal-title { color: #222; line-height: 1.3; }

    .cal-empty { font-size: 0.82rem; color: #ddd; padding: 4px 0; }

    /* Prioritäts-Dot */
    .dot-high   { color: #ef4444; }
    .dot-medium { color: #f59e0b; }
    .dot-low    { color: #d1d5db; }

    /* ════════════════════════════════
       RECHTE SPALTE – Chat
    ════════════════════════════════ */
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 40px 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Nutzernachricht ── */
    .msg.user {
      align-self: flex-end;
      font-size: 0.95rem;
      display: flex;
      align-items: flex-end;
      gap: 5px;
    }

    /* ── Haken ── */
    .ticks { display: inline-flex; align-items: center; flex-shrink: 0; margin-bottom: 1px; }
    .ticks svg { width: 16px; height: 11px; }
    .ticks svg path { stroke: #aaa; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ticks.delivered svg path { stroke: #aaa; }
    .ticks.read      svg path { stroke: #4fc3f7; }
    .ticks.sent .second { display: none; }

    /* ── Systemantwort ── */
    .msg.system { align-self: flex-start; font-size: 0.88rem; color: #333; line-height: 1.6; }
    .msg.system .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #aaa; margin-bottom: 6px; }
    .msg.system .row { display: flex; gap: 10px; }
    .msg.system .time { color: #bbb; min-width: 34px; font-size: 0.82rem; }
    .msg.system .sep { height: 6px; }
    .msg.system.error { color: #c00; font-size: 0.85rem; }

    /* ── Löschen / Verschieben ── */
    .deleting { opacity: 0; transform: scale(0.96); transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none; }
    .deletable  { cursor: pointer; }
    .postponable { cursor: pointer; }
    .pcount { font-size: 0.7rem; color: #ccc; margin-left: 4px; }
    .pcount.warn { color: #f59e0b; }
    .locked-task { text-decoration: line-through; color: #bbb; cursor: default; }

    /* ── Platzhalter ── */
    #placeholder { margin: auto; color: #ddd; font-size: 0.9rem; pointer-events: none; }

    /* ── Eingabe ── */
    #bar {
      border-top: 1px solid #f0f0f0;
      padding: 14px 28px;
      display: flex;
      gap: 10px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    #input {
      flex: 1; border: none; outline: none;
      font-size: 0.95rem; font-family: inherit;
      color: #111; background: transparent;
      resize: none; height: 24px; line-height: 24px;
    }
    #input::placeholder { color: #ccc; }
    #send {
      border: none; background: none; cursor: pointer;
      color: #bbb; font-size: 1.1rem; padding: 0 4px;
      line-height: 24px; transition: color 0.15s;
    }
    #send:hover { color: #333; }
    #send:disabled { color: #e0e0e0; cursor: default; }

    /* ── Toast ── */
    #toast {
      display: none; position: fixed; bottom: 72px; left: 50%;
      transform: translateX(-50%); background: #f59e0b; color: #fff;
      font-size: 0.82rem; padding: 8px 16px; border-radius: 6px;
      z-index: 100; white-space: nowrap;
    }

    /* ── Erinnerungs-Banner ── */
    #reminder {
      display: none; position: fixed; top: 16px; left: 50%;
      transform: translateX(-50%); background: #111; color: #fff;
      font-size: 0.85rem; padding: 10px 18px; border-radius: 8px;
      z-index: 100; cursor: pointer;
    }

    /* ── Mobile: Sidebar oben ── */
    @media (max-width: 600px) {
      body { flex-direction: column; }
      #sidebar {
        width: 100%; border-right: none;
        border-bottom: 1px solid #f0f0f0;
        padding: 16px 20px;
        flex-direction: row; flex-wrap: wrap; gap: 0 24px;
        max-height: 160px;
      }
      #sidebar .date { width: 100%; margin-bottom: 8px; }
      #sidebar .section-label { margin-top: 0; }
    }
  </style>
</head>
<body>

<div id="reminder" onclick="this.style.display='none'"></div>
<div id="toast"></div>

<!-- ── Sidebar ── -->
<div id="sidebar">
  <div class="date" id="sidebar-date"></div>
  <div class="section-label">Termine</div>
  <div id="cal-events"><div class="cal-empty">–</div></div>
  <div class="section-label">Aufgaben</div>
  <div id="cal-tasks"><div class="cal-empty">–</div></div>
</div>

<!-- ── Chat ── -->
<div id="chat">
  <div id="feed">
    <p id="placeholder">Was steht heute an?</p>
  </div>
  <div id="bar">
    <textarea id="input" placeholder="Meeting, Aufgabe, Frage …" rows="1"></textarea>
    <button id="send">↑</button>
  </div>
</div>

<script>
  const feed  = document.getElementById('feed');
  const input = document.getElementById('input');
  const send  = document.getElementById('send');

  // ── Sidebar ───────────────────────────────────────────────
  const dot = { high: '●', medium: '◐', low: '○' };
  const dotCls = { high: 'dot-high', medium: 'dot-medium', low: 'dot-low' };

  document.getElementById('sidebar-date').textContent =
    new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });

  async function refreshSidebar() {
    try {
      const data = await fetch('/today').then(r => r.json());

      const evEl = document.getElementById('cal-events');
      const tkEl = document.getElementById('cal-tasks');

      evEl.innerHTML = data.events.length ? '' : '<div class="cal-empty">–</div>';
      data.events.forEach(ev => {
        const r = document.createElement('div');
        r.className = 'cal-row deletable';
        r.title = 'Doppelklick: löschen';
        r.innerHTML = `<span class="cal-time">${escHtml(ev.time)}</span><span class="cal-title">${escHtml(ev.title)}</span>`;
        r.addEventListener('dblclick', () => softDelete(r, 'event', ev.id));
        evEl.appendChild(r);
      });

      tkEl.innerHTML = data.tasks.length ? '' : '<div class="cal-empty">–</div>';
      data.tasks.forEach(tk => {
        const locked = tk.postpone_count >= 3;
        const r = document.createElement('div');
        r.className = 'cal-row' + (locked ? ' locked-task' : ' deletable postponable');
        r.title = locked ? 'Doppelklick: löschen' : 'Klick: morgen · Doppelklick: löschen';
        r.innerHTML = `<span class="cal-time ${dotCls[tk.priority]}">${dot[tk.priority]}</span><span class="cal-title">${escHtml(tk.title)}</span>`;
        if (!locked) r.addEventListener('click', () => postponeTask(r, tk.id, tk.postpone_count));
        r.addEventListener('dblclick', e => { e.stopPropagation(); softDelete(r, locked ? 'task' : 'task', tk.id); });
        tkEl.appendChild(r);
      });
    } catch {}
  }

  refreshSidebar();
  setInterval(refreshSidebar, 60_000);

  // ── Haken-SVG ─────────────────────────────────────────────
  const DOUBLE_TICK = `
    <svg viewBox="0 0 16 11" style="margin-right:-7px"><path d="M1 5.5 L5.5 10 L15 1"/></svg>
    <svg viewBox="0 0 16 11" class="second"><path d="M1 5.5 L5.5 10 L15 1"/></svg>`;

  function addUserMsg(text) {
    document.getElementById('placeholder')?.remove();
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = `<span>${escHtml(text)}</span><span class="ticks sent">${DOUBLE_TICK}</span>`;
    feed.appendChild(el);
    feed.scrollTop = feed.scrollHeight;
    return el.querySelector('.ticks');
  }

  function setTick(el, state) { el.className = 'ticks ' + state; }

  function attachDeleteToLastUserMsg(dtype, id) {
    const msgs = feed.querySelectorAll('.msg.user');
    const last = msgs[msgs.length - 1];
    if (last) makeDeletable(last, dtype, id);
  }

  function addSystemMsg(html) {
    const el = document.createElement('div');
    el.className = 'msg system';
    el.innerHTML = html;
    feed.appendChild(el);
    feed.scrollTop = feed.scrollHeight;
  }

  // ── Toast ─────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, color = '#f59e0b') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.background = color; t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  // ── Soft-Delete ───────────────────────────────────────────
  async function softDelete(el, dtype, id) {
    el.classList.add('deleting');
    await fetch(`/entry/${dtype}/${id}`, { method: 'DELETE' });
    setTimeout(() => { el.remove(); refreshSidebar(); }, 220);
  }

  function makeDeletable(el, dtype, id) {
    el.classList.add('deletable');
    el.title = 'Doppelklick: löschen';
    el.addEventListener('dblclick', () => softDelete(el, dtype, id));
  }

  // ── Verschieben ───────────────────────────────────────────
  async function postponeTask(row, id, currentCount) {
    if (currentCount >= 3) { showToast('Nicht mehr verschiebbar.', '#999'); return; }
    row.style.pointerEvents = 'none';
    const res  = await fetch(`/entry/task/${id}/postpone`, { method: 'PATCH' });
    const data = await res.json();
    if (data.count === 3) showToast('⚠️ Letzte mal verschoben!');
    row.classList.add('deleting');
    setTimeout(() => { row.remove(); refreshSidebar(); }, 220);
  }

  // ── Submit ────────────────────────────────────────────────
  async function submit() {
    const text = input.value.trim();
    if (!text) return;

    const ticks = addUserMsg(text);
    input.value = ''; input.style.height = '24px';
    send.disabled = true;
    setTick(ticks, 'sent');

    try {
      const res  = await fetch('/parse', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      setTick(ticks, 'delivered');
      const data = await res.json();

      if (data.error) { addSystemMsg(`<span class="error">${escHtml(data.error)}</span>`); return; }

      setTick(ticks, 'read');

      if (data.type === 'event' || data.type === 'task') {
        attachDeleteToLastUserMsg(data.type, data.id);
        refreshSidebar();
      }

      if (data.type === 'query') {
        const evs = data.events || [], tks = data.tasks || [];
        const wrap = document.createElement('div');
        wrap.className = 'msg system';
        const lbl = document.createElement('div');
        lbl.className = 'label'; lbl.textContent = data.label;
        wrap.appendChild(lbl);

        if (!evs.length && !tks.length) {
          wrap.innerHTML += '<div class="row"><span class="time">–</span>Keine Einträge</div>';
        }
        evs.forEach(ev => {
          const r = document.createElement('div');
          r.className = 'row deletable'; r.title = 'Doppelklick: löschen';
          r.innerHTML = `<span class="time">${escHtml(ev.time)}</span>${escHtml(ev.title)}`;
          r.addEventListener('dblclick', () => softDelete(r, 'event', ev.id));
          wrap.appendChild(r);
        });
        if (tks.length && evs.length) { const s = document.createElement('div'); s.className='sep'; wrap.appendChild(s); }
        tks.forEach(tk => {
          const locked = tk.postpone_count >= 3;
          const r = document.createElement('div');
          r.className = 'row' + (locked ? ' locked-task' : ' deletable postponable');
          r.title = locked ? 'Doppelklick: löschen' : 'Klick: morgen · Doppelklick: löschen';
          let badge = tk.postpone_count > 0 && !locked ? `<span class="pcount${tk.postpone_count===2?' warn':''}"">+${tk.postpone_count}</span>` : '';
          r.innerHTML = `<span class="time">${dot[tk.priority]||'·'}</span>${escHtml(tk.title)}${badge}`;
          if (!locked) r.addEventListener('click', () => postponeTask(r, tk.id, tk.postpone_count));
          r.addEventListener('dblclick', e => { e.stopPropagation(); softDelete(r, 'task', tk.id); });
          wrap.appendChild(r);
        });
        document.getElementById('placeholder')?.remove();
        feed.appendChild(wrap); feed.scrollTop = feed.scrollHeight;
      }
    } catch { addSystemMsg('<span class="error">Verbindungsfehler.</span>'); }
    finally { send.disabled = false; input.focus(); }
  }

  send.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();} });
  input.addEventListener('input', () => { input.style.height='24px'; input.style.height=input.scrollHeight+'px'; });

  // ── Erinnerungen ─────────────────────────────────────────
  const banner = document.getElementById('reminder');
  const notified = new Set();
  async function checkReminders() {
    try {
      const data = await fetch('/reminders').then(r => r.json());
      const list = (data.reminders||[]).filter(r => !notified.has(r.title+r.time));
      if (!list.length) return;
      list.forEach(r => notified.add(r.title+r.time));
      banner.textContent = '⏰ ' + list.map(r=>`${r.time} · ${r.title}`).join('  ');
      banner.style.display = 'block';
      setTimeout(() => { banner.style.display='none'; }, 10000);
    } catch {}
  }
  checkReminders();
  setInterval(checkReminders, 60_000);

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
